services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: investigation-backend
    # PDF generation shells out to Chromium (investigationPdfService.js), which
    # forks crashpad handler subprocesses. Without a real init as PID 1, an
    # abruptly-killed or crashed Chromium leaves those as unreaped zombies forever
    # (Node doesn't reap grandchildren). `init: true` uses Docker's built-in tini.
    init: true
    env_file:
      - ./server/.env
    environment:
      PORT: 2003
      # Internal Docker-network addresses — different from the host-published ports
      # below, which are what your browser / host-side scripts use.
      MONGO_URI: mongodb://mongo:3003
      MONGO_DB: investigation-chart
      MINIO_ENDPOINT: minio
      MINIO_PORT: 4003
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: investigation-reports
      # The browser resolves this host itself when following a presigned PDF URL,
      # so it must be reachable from wherever the browser actually is — "localhost"
      # only works when the browser and this stack are on the same machine. Point
      # this at the server's real hostname/IP for anything beyond local testing.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: 4003
      # "Ask AI" assistant key, from the root .env (assistantService.js). Named
      # GROQ_API, not GROQ_API_KEY, so a GROQ_API_KEY in server/.env still wins.
      GROQ_API: ${GROQ_API:-}
      # WhatsApp PDF links (publicLinkService.js). With PUBLIC_BASE_URL set (the
      # https address from the "https" service below) the PDF is served through
      # this app and shows inside WATI's inbox; unset, it's the plain-http MinIO link.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WHATSAPP_LINK_DAYS: ${WHATSAPP_LINK_DAYS:-2}
      # WATI's monthly API quota is shared with sending — see watiBudget.js.
      WATI_STATUS_CHECKS_PER_DAY: ${WATI_STATUS_CHECKS_PER_DAY:-100}
    # A single templated bind string (not a second "ports:" list in an override
    # file) — Compose concatenates list-valued keys across -f files instead of
    # replacing them, so a docker-compose.prod.yml override here would leave
    # BOTH the public and the loopback binding active at once. Overriding the
    # env var in .env is the only way to actually change this per environment.
    ports:
      - "${SERVER_PORT_BIND:-2003:2003}"
    depends_on:
      - mongo
      - minio
    restart: unless-stopped
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: investigation-front
    ports:
      - "${CLIENT_PORT_BIND:-1003:80}"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: investigation-mongo
    command: ["--port", "3003"]
    ports:
      - "${MONGO_PORT_BIND:-3003:3003}"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: investigation-min.io
    command: ["server", "/data", "--address", ":4003", "--console-address", ":5003"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT_BIND:-4003:4003}"
      - "${MINIO_CONSOLE_PORT_BIND:-5003:5003}"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - app-network

  # HTTPS in front of the app, with a free Let's Encrypt certificate that Caddy
  # gets and renews by itself. Off unless enabled — in the root .env:
  #   COMPOSE_PROFILES=https
  #   PUBLIC_HOST=194-238-22-210.sslip.io        (or your own domain)
  #   PUBLIC_BASE_URL=https://194-238-22-210.sslip.io
  # Needs ports 80 and 443 free on the host and open in the firewall.
  https:
    image: caddy:2-alpine
    container_name: investigation-https
    profiles: ["https"]
    command: ["caddy", "reverse-proxy", "--from", "${PUBLIC_HOST:-localhost}", "--to", "client:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - client
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
  caddy-data:
