services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: patient-investigation-server
    env_file:
      - ./server/.env
    environment:
      PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: patient-investigation-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
