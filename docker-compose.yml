services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: patient-investigation-server
    env_file:
      - ./server/.env
    environment:
      PORT: 2000
    ports:
      - "2000:2000"
    expose:
      - "2000"
    restart: unless-stopped
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: patient-investigation-client
    ports:
      - "1000:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
