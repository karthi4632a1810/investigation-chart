services:
  mongo:
    image: mongo:7
    container_name: patient-investigation-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: patient-investigation-server
    env_file:
      - ./server/.env
    environment:
      PORT: 2000
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "2000:2000"
    expose:
      - "2000"
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: patient-investigation-client
    ports:
      - "1000:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
