# Host nginx site config for invest.mapims.edu.in
# Install on server:
#   sudo cp deploy/nginx/invest.mapims.edu.in.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/invest.mapims.edu.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker app must be running on host port 1000:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

upstream invest_app {
    server 127.0.0.1:1000;
    keepalive 32;
}

# HTTP — use for initial test, or certbot challenge before SSL
server {
    listen 80;
    listen [::]:80;
    server_name invest.mapims.edu.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after SSL is issued (see HTTPS block below)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Remove this location block once HTTPS redirect is enabled above
    location / {
        proxy_pass http://invest_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}

# HTTPS — enable after running certbot:
#   sudo certbot certonly --webroot -w /var/www/certbot -d invest.mapims.edu.in
