# HTTPS-enabled config (use after certbot certificate is issued)
# Replace invest.mapims.edu.in.conf with this file, or merge manually.

upstream invest_app {
    server 127.0.0.1:1000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name invest.mapims.edu.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invest.mapims.edu.in;

    ssl_certificate     /etc/letsencrypt/live/invest.mapims.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest.mapims.edu.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://invest_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
